name: daily-price-report

on:
  schedule:
    - cron: "40 22 * * *"   # 매일 07:40 KST (UTC 22:40)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write            # 누적 데이터(data/commerce_signal.db)를 저장소에 커밋

concurrency: daily-price-report

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 수집 → 매칭 → 비교 → 슬랙
        run: python -m commerce_signal daily
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      - name: 누적 데이터 저장
        if: always()
        run: |
          git config user.name "commerce-signal-bot"
          git config user.email "commerce-signal-bot@users.noreply.github.com"
          git add data/commerce_signal.db
          git diff --cached --quiet || git commit -m "data: daily snapshot $(TZ=Asia/Seoul date +%F)"
          git push
